<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주얼리 셀렉션 | AIEdu 실습</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #29221f; background: #fbf8f3; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1000px; margin: auto; padding: 24px 20px 64px; }
  header { padding: 36px 0 20px; }
  .eyebrow { color: #78503a; font-weight: 700; }
  h1 { font-size: clamp(2rem, 7vw, 4rem); margin: 10px 0; }
  p { line-height: 1.6; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); }
  article, form { border: 1px solid #e2d6cc; border-radius: 16px; padding: 18px; background: #fff; }
  article svg { width: 100%; height: 120px; border-radius: 10px; background: #f7eee1; fill: none; stroke: #997039; stroke-width: 4; }
  article h3 { margin-bottom: 4px; }
  button { border: 0; border-radius: 8px; padding: 10px 14px; background: #513522; color: #fff; font: inherit; cursor: pointer; }
  label { display: block; font-weight: 650; margin: 14px 0 4px; }
  select, textarea { width: 100%; border: 1px solid #9a8271; border-radius: 8px; padding: 9px; font: inherit; }
  textarea { min-height: 82px; }
  form button { margin-top: 14px; }
  #preview { white-space: pre-wrap; overflow-wrap: anywhere; background: #f7eee1; padding: 14px; border-radius: 8px; }
  #error { color: #9c2631; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">AIEdu · 교육용 데모</div>
    <h1>주얼리 셀렉션</h1>
    <p>상품을 둘러보고 궁금한 옵션을 문의해 보세요. 문의 내용은 화면에만 미리 표시됩니다.</p>
  </header>
  <section aria-labelledby="products-heading">
    <h2 id="products-heading">예시 상품</h2>
    <div class="grid">
      <article>
        <svg aria-hidden="true" viewBox="0 0 160 100"><ellipse cx="80" cy="60" rx="27" ry="25"/><path d="m69 38 11-15 11 15z"/></svg>
        <h3>데일리 링</h3><p>반지 사이즈가 궁금할 때</p>
        <button type="button" data-product="ring">반지 문의하기</button>
      </article>
      <article>
        <svg aria-hidden="true" viewBox="0 0 160 100"><path d="M40 20c0 59 80 59 80 0M80 58l12 14-12 14-12-14z"/></svg>
        <h3>펜던트 목걸이</h3><p>체인 길이가 궁금할 때</p>
        <button type="button" data-product="necklace">목걸이 문의하기</button>
      </article>
      <article>
        <svg aria-hidden="true" viewBox="0 0 160 100"><circle cx="56" cy="53" r="18"/><circle cx="104" cy="53" r="18"/><path d="M56 35v-9m48 9v-9"/></svg>
        <h3>링 귀걸이</h3><p>잠금 방식이 궁금할 때</p>
        <button type="button" data-product="earrings">귀걸이 문의하기</button>
      </article>
    </div>
  </section>
  <section aria-labelledby="inquiry-heading">
    <h2 id="inquiry-heading">상품 문의 미리보기</h2>
    <form id="inquiry" novalidate>
      <label for="product">상품 (필수)</label>
      <select id="product" required aria-describedby="error">
        <option value="">상품을 선택하세요</option><option value="ring">데일리 링</option>
        <option value="necklace">펜던트 목걸이</option><option value="earrings">링 귀걸이</option>
      </select>
      <label for="question">문의 내용 (필수)</label>
      <textarea id="question" required maxlength="500" aria-describedby="error" placeholder="예: 반지 12호 옵션이 있나요?"></textarea>
      <button type="submit">문의 미리보기</button>
      <p id="error" role="alert" hidden></p>
      <div id="preview" role="status" hidden></div>
    </form>
  </section>
</main>
<script>
  const form = document.querySelector("#inquiry");
  const product = document.querySelector("#product");
  const question = document.querySelector("#question");
  const error = document.querySelector("#error");
  const preview = document.querySelector("#preview");

  document.querySelectorAll("[data-product]").forEach((button) => {
    button.addEventListener("click", () => {
      product.value = button.dataset.product;
      form.dispatchEvent(new Event("input"));
      question.focus();
    });
  });

  form.addEventListener("input", () => {
    error.hidden = true;
    preview.hidden = true;
    product.removeAttribute("aria-invalid");
    question.removeAttribute("aria-invalid");
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const message = question.value.trim();
    preview.hidden = true;
    if (!product.value || !message) {
      const field = product.value ? question : product;
      error.textContent = product.value ? "문의 내용을 입력해 주세요." : "상품을 선택해 주세요.";
      error.hidden = false;
      field.setAttribute("aria-invalid", "true");
      field.focus();
      return;
    }
    error.hidden = true;
    preview.textContent = "미리보기 · " + product.selectedOptions[0].text + "\n" + message;
    preview.hidden = false;
  });
</script>
</body>
</html>
